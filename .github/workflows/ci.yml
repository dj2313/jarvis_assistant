name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # pubspec.yaml lists .env as a Flutter asset, but .env is gitignored.
      # Materialize it from the tracked template so the analyzer (and tests)
      # don't report asset_does_not_exist. Values are placeholders.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter test
